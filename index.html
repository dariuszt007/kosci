<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symulator rzutu kostkami</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-glow"></div>

  <main class="container">
    <h1>Symulator rzutu kostkami</h1>
    <p class="subtitle">
      Kliknij <strong>Start</strong>, aby uruchomić obracanie kostek, a potem
      <strong>Stop</strong>, aby zatrzymać rzut.
    </p>

    <section class="dice-section">
      <div class="dice-container">
        <div class="dice-wrapper">
          <h2>Kostka 1</h2>
          <div class="dice" id="dice1">
            <span class="dot top-left"></span>
            <span class="dot top-center"></span>
            <span class="dot top-right"></span>
            <span class="dot middle-left"></span>
            <span class="dot center"></span>
            <span class="dot middle-right"></span>
            <span class="dot bottom-left"></span>
            <span class="dot bottom-center"></span>
            <span class="dot bottom-right"></span>
          </div>
        </div>

        <div class="dice-wrapper">
          <h2>Kostka 2</h2>
          <div class="dice" id="dice2">
            <span class="dot top-left"></span>
            <span class="dot top-center"></span>
            <span class="dot top-right"></span>
            <span class="dot middle-left"></span>
            <span class="dot center"></span>
            <span class="dot middle-right"></span>
            <span class="dot bottom-left"></span>
            <span class="dot bottom-center"></span>
            <span class="dot bottom-right"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="resetBtn">Reset</button>
    </section>

    <section class="info-panel">
      <div class="info-box">
        <span class="label">Ostatni wynik:</span>
        <span class="value" id="lastResult">1 + 1 = 2</span>
      </div>
      <div class="info-box">
        <span class="label">Liczba rzutów:</span>
        <span class="value" id="rollCount">0</span>
      </div>
      <div class="info-box">
        <span class="label">Najwyższa suma:</span>
        <span class="value" id="bestScore">0</span>
      </div>
    </section>

    <section class="history-section">
      <h2>Historia rzutów</h2>
      <ul id="historyList">
        <li>Brak rzutów</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
